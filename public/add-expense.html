<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Expense – BizTracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon"><i class="bi bi-bar-chart-fill text-white"></i></div>
    BizTracker
  </div>
  <nav>
    <div class="sidebar-section-label">Main</div>
    <a href="/index.html"       class="nav-link su-only"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
    <a href="/add-expense.html" class="nav-link" data-screen="expenses" data-sub="add"><i class="bi bi-plus-circle"></i><span>Add Expense</span></a>
    <a href="/expenses.html"    class="nav-link" data-screen="expenses"><i class="bi bi-receipt"></i><span>Expense Report</span></a>
    <a href="/sales.html"       class="nav-link" data-screen="sales"><i class="bi bi-graph-up-arrow"></i><span>Sales Capture</span></a><a href="/reports.html" class="nav-link su-only" data-screen="reports"><i class="bi bi-clipboard-data"></i><span>Profit &amp; Loss</span></a>
      <a href="/categories.html"  class="nav-link su-only" data-screen="categories"><i class="bi bi-tags"></i><span>Categories</span></a>
    <a href="/employees.html"   class="nav-link su-only" data-screen="employees"><i class="bi bi-people"></i><span>Employees</span></a>
      <a href="/salaries.html"    class="nav-link su-only" data-screen="salaries"><i class="bi bi-cash-stack"></i><span>Salaries</span></a>
    <a href="/users.html"       class="nav-link su-only" data-screen="users"><i class="bi bi-person-lock"></i><span>Users</span></a>
  </nav>
</aside>

<div class="main-content">
  <nav class="top-navbar">
    <div class="d-flex align-items-center gap-3">
      <button class="mobile-toggle" id="sidebarToggle"><i class="bi bi-list fs-4"></i></button>
      <h1 class="page-title">Add Expense</h1>
    </div>
    <span class="text-muted small" id="todayLabel"></span>
  </nav>

  <div class="content-wrapper">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">

        <div class="card-panel">
          <div class="card-panel-header">
            <h6 class="card-panel-title"><i class="bi bi-pencil-square me-2"></i>Daily Expense Entry</h6>
          </div>
          <div class="card-panel-body">

            <!-- Date + Remarks -->
            <div class="row g-3 mb-3">
              <div class="col-7">
                <label class="form-label fw-semibold">Date <span class="text-danger">*</span></label>
                <input type="date" class="form-control" id="expDate" required>
              </div>
              <div class="col-5">
                <label class="form-label fw-semibold">Remarks</label>
                <input type="text" class="form-control" id="expRemarks" placeholder="Optional…">
              </div>
            </div>

            <hr class="my-3">

            <!-- Category rows -->
            <div id="categoryRows">
              <div class="text-center py-4 text-muted">
                <div class="spinner-border spinner-border-sm text-primary me-2"></div>Loading categories…
              </div>
            </div>

            <!-- Grand total -->
            <div class="d-flex justify-content-between align-items-center mt-3 px-3 py-2 rounded"
                 style="background:#f0f9ff;border:1.5px solid #bae6fd;">
              <span class="fw-bold">Total</span>
              <span class="fw-bold fs-5 text-primary" id="runningTotal">₹0</span>
            </div>

            <!-- Save -->
            <div class="d-grid mt-3">
              <button class="btn btn-primary btn-lg" id="btnSaveExpense">
                <i class="bi bi-check-lg me-1"></i>Save Expense
              </button>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/main.js"></script>
<script src="/js/add-expense.js"></script>
</body>
</html>
