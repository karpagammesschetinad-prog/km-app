<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#4646eb"/>
  <!-- Bar chart bars -->
  <rect x="80"  y="280" width="80" height="160" rx="10" fill="rgba(255,255,255,0.5)"/>
  <rect x="200" y="200" width="80" height="240" rx="10" fill="rgba(255,255,255,0.75)"/>
  <rect x="320" y="120" width="80" height="320" rx="10" fill="#ffffff"/>
  <!-- Trend line -->
  <polyline points="120,260 240,180 360,100" fill="none" stroke="#fbbf24" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dots on line -->
  <circle cx="120" cy="260" r="12" fill="#fbbf24"/>
  <circle cx="240" cy="180" r="12" fill="#fbbf24"/>
  <circle cx="360" cy="100" r="12" fill="#fbbf24"/>
  <!-- "B" letter top-right accent -->
  <text x="418" y="88" font-size="72" font-family="Arial,sans-serif" font-weight="900" fill="white" opacity="0.3">B</text>
</svg>
