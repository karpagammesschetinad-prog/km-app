<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expenses � BizTracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon"><i class="bi bi-bar-chart-fill text-white"></i></div>
    BizTracker
  </div>
  <nav>
    <div class="sidebar-section-label">Main</div>
    <a href="/index.html"      class="nav-link su-only"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
    <a href="/expenses.html"   class="nav-link" data-screen="expenses"><i class="bi bi-receipt"></i><span>Expenses</span></a>
    <a href="/sales.html"       class="nav-link" data-screen="sales"><i class="bi bi-graph-up-arrow"></i><span>Sales Capture</span></a>
    <a href="/categories.html" class="nav-link su-only" data-screen="categories"><i class="bi bi-tags"></i><span>Categories</span></a>
    <a href="/employees.html"  class="nav-link su-only" data-screen="employees"><i class="bi bi-people"></i><span>Employees</span></a>
    <a href="/salaries.html"   class="nav-link su-only" data-screen="salaries"><i class="bi bi-cash-stack"></i><span>Salaries</span></a>
    <a href="/users.html" class="nav-link su-only" data-screen="users"><i class="bi bi-person-lock"></i><span>Users</span></a>
  </nav>
</aside>

<div class="main-content">
  <nav class="top-navbar">
    <div class="d-flex align-items-center gap-3">
      <button class="mobile-toggle" id="sidebarToggle"><i class="bi bi-list fs-4"></i></button>
      <h1 class="page-title">Expenses</h1>
    </div>
    <div class="d-flex align-items-center gap-2">
    <button class="btn btn-primary btn-sm" id="btnEmployeeExpense">
      <i class="bi bi-person-plus me-1"></i>Add Employee Expense
    </button>
    <button class="btn btn-outline-primary btn-sm su-only" id="btnReport">
      <i class="bi bi-bar-chart-line me-1"></i>Report
    </button>
    </div>
  </nav>

  <div class="content-wrapper">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-10 col-xl-8">

        <div class="card-panel">
          <div class="card-panel-header">
            <h6 class="card-panel-title" id="formTitle">
              <i class="bi bi-pencil-square me-2"></i>Expense
            </h6>
            <div class="d-flex align-items-center gap-2 flex-wrap justify-content-end">
              <div id="categoryTypeTotals" class="expense-type-totals" aria-live="polite"></div>
              <span class="badge bg-primary-subtle text-primary border border-primary-subtle" id="formBadge">Today</span>
            </div>
          </div>
          <div class="card-panel-body">

            <div class="row g-3 mb-3">
              <div class="col-12 col-sm-6 expense-date-field">
                <label class="form-label fw-semibold">Date <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="expDate" readonly aria-haspopup="dialog" aria-expanded="false">
                <div id="expenseDatePicker" class="expense-date-picker" role="dialog" aria-label="Expense date picker"></div>
              </div>
              <div class="col-12 col-sm-6">
                <label class="form-label fw-semibold">Remarks</label>
                <input type="text" class="form-control" id="expRemarks" placeholder="Optional�">
              </div>
            </div>

            <hr class="my-2">

            <!-- Rejection notice shown to cashier if this date was rejected -->
            <div id="rejectionNotice" class="alert alert-danger py-2 small mb-2" style="display:none"></div>

            <div id="categoryInputs">
              <div class="text-center py-3 text-muted">
                <div class="spinner-border spinner-border-sm text-primary me-2"></div>Loading�
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-3 px-3 py-2 rounded"
                 style="background:#f0f9ff;border:1px solid #bae6fd;">
              <span class="fw-bold">Total</span>
              <span class="fw-bold fs-5 text-primary" id="expRunningTotal">?0</span>
            </div>

            <div class="mt-3 d-grid">
              <button class="btn btn-primary" id="btnSaveExpense">
                <i class="bi bi-check-lg me-1"></i>Save Expense
              </button>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- Employee expense payment modal -->
<div class="modal fade" id="employeeExpenseModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-person-plus me-2"></i>Add Employee Expense</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="employeeExpenseForm" novalidate>
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Employee <span class="text-danger">*</span></label>
              <select class="form-select" id="employeeExpenseEmployee" required></select>
            </div>
            <div class="col-6">
              <label class="form-label">Payment Date <span class="text-danger">*</span></label>
              <input type="date" class="form-control" id="employeeExpenseDate" required>
            </div>
            <div class="col-6">
              <label class="form-label">Amount <span class="text-danger">*</span></label>
              <input type="number" class="form-control" id="employeeExpenseAmount" min="0.01" step="0.01" required>
            </div>
            <div class="col-12">
              <label class="form-label">Expense Type <span class="text-danger">*</span></label>
              <select class="form-select" id="employeeExpenseType" required></select>
            </div>
            <div class="col-12">
              <label class="form-label">Remarks</label>
              <input type="text" class="form-control" id="employeeExpenseRemarks" placeholder="Optional note">
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="btnSaveEmployeeExpense"><i class="bi bi-check-lg me-1"></i>Save Payment</button>
      </div>
    </div>
  </div>
</div>

<!-- Report Modal -->
<div class="modal fade" id="reportModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-bar-chart-line me-2"></i>Expense Report</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-0">

        <!-- Filters row -->
        <div class="p-3 border-bottom bg-light expense-report-filters">
          <div class="row g-2 align-items-end">
            <div class="col-6 col-md-auto">
              <label class="form-label mb-1 small fw-semibold">From</label>
              <input type="date" class="form-control form-control-sm" id="fDateFrom" style="width:145px">
            </div>
            <div class="col-6 col-md-auto">
              <label class="form-label mb-1 small fw-semibold">To</label>
              <input type="date" class="form-control form-control-sm" id="fDateTo" style="width:145px">
            </div>
            <div class="col-12 col-md">
              <label class="form-label mb-1 small fw-semibold">Categories</label>
              <div id="catFilterChips" class="d-flex flex-wrap gap-1"></div>
            </div>
            <div class="col-12">
              <div class="expense-status-legend" aria-label="Expense approval status colors">
                <span><i class="expense-status-dot approved"></i>Approved</span>
                <span><i class="expense-status-dot pending"></i>Pending</span>
                <span><i class="expense-status-dot rejected"></i>Rejected</span>
              </div>
            </div>
            <div class="col-auto d-flex gap-2 filter-actions">
              <button class="btn btn-sm btn-primary" id="btnFilter">
                <i class="bi bi-search me-1"></i>Show
              </button>
              <button class="btn btn-sm btn-outline-secondary" id="btnClearFilter">
                <i class="bi bi-x-lg me-1"></i>Clear
              </button>
              <button class="btn btn-sm btn-outline-secondary" id="btnToggleChart" title="Toggle chart">
                <i class="bi bi-graph-up me-1"></i>Chart
              </button>
            </div>
          </div>
        </div>

        <!-- Line chart -->
        <div id="chartSection" style="display:none;" class="p-3 border-bottom" style="background:#fafbfc">
          <canvas id="expenseChart" height="90"></canvas>
        </div>

        <!-- Summary table -->
        <div class="table-responsive">
          <table class="table mobile-grid-table mb-0">
            <thead>
              <tr>
                <th style="width:120px">Date</th>
                <th>Categories</th>
                <th class="text-end" style="width:130px">Total</th>
                <th style="width:90px">Status</th>
                <th style="width:100px"></th>
              </tr>
            </thead>
            <tbody id="expBody">
              <tr><td colspan="5" class="text-center py-4 text-muted">
                <div class="spinner-border spinner-border-sm text-primary me-2"></div>Loading�
              </td></tr>
            </tbody>
            <tfoot id="expFoot"></tfoot>
          </table>
        </div>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="/js/main.js"></script>
<script src="/js/expenses.js"></script>

<!-- Reject Reason Modal -->
<div class="modal fade" id="rejectModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h6 class="modal-title text-danger"><i class="bi bi-x-circle me-1"></i>Reject Expense</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="small text-muted mb-2">Provide a reason so the cashier can correct the entry.</p>
        <textarea class="form-control" id="rejectReason" rows="3" placeholder="Reason for rejection�"></textarea>
      </div>
      <div class="modal-footer py-2">
        <button type="button" class="btn btn-sm btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-sm btn-danger" id="btnConfirmReject">
          <i class="bi bi-x-circle me-1"></i>Reject
        </button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
