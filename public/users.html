<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users � BizTracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .user-card { cursor:pointer; border-left:3px solid transparent; transition:.15s; }
    .user-card:hover { background:#f8fafc; border-left-color:#94a3b8; }
    .user-card.selected { background:#eff6ff; border-left-color:#3b82f6; }
    .detail-panel { display:none; border-left:1px solid var(--border); background:#fff; }
    .detail-panel.show { display:block; }
    .perm-item { display:flex; align-items:center; gap:.6rem; padding:.45rem 0; border-bottom:1px solid #f1f5f9; font-size:.875rem; }
    .perm-item:last-child { border-bottom:none; }
    .perm-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .avatar { width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.1rem; font-weight:700; flex-shrink:0; }
  </style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon"><i class="bi bi-bar-chart-fill text-white"></i></div>
    BizTracker
  </div>
  <nav>
    <div class="sidebar-section-label">Main</div>
    <a href="/index.html"      class="nav-link"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
    <a href="/expenses.html"   class="nav-link" data-screen="expenses"><i class="bi bi-receipt"></i><span>Expenses</span></a>
    <a href="/categories.html" class="nav-link su-only" data-screen="categories"><i class="bi bi-tags"></i><span>Categories</span></a>
    <a href="/employees.html"  class="nav-link su-only" data-screen="employees"><i class="bi bi-people"></i><span>Employees</span></a>
    <a href="/salaries.html"   class="nav-link su-only" data-screen="salaries"><i class="bi bi-cash-stack"></i><span>Salaries</span></a>
    <a href="/users.html"      class="nav-link su-only" data-screen="users"><i class="bi bi-person-lock"></i><span>Users</span></a>
  </nav>
</aside>

<div class="main-content">
  <nav class="top-navbar">
    <div class="d-flex align-items-center gap-3">
      <button class="mobile-toggle" id="sidebarToggle"><i class="bi bi-list fs-4"></i></button>
      <h1 class="page-title">Authorization</h1>
    </div>
    <button class="btn btn-primary btn-sm" id="btnAddUser">
      <i class="bi bi-person-plus me-1"></i>Add User
    </button>
  </nav>

  <div class="content-wrapper">

    <!-- Stat cards -->
    <div class="row g-3 mb-4" id="statsRow">
      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="stat-icon" style="background:#eff6ff"><i class="bi bi-people text-primary"></i></div>
          <div><div class="stat-label">Total Users</div><div class="stat-value" id="stTotal">�</div></div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="stat-icon" style="background:#f0fdf4"><i class="bi bi-shield-check text-success"></i></div>
          <div><div class="stat-label">Super Users</div><div class="stat-value" id="stSuper">�</div></div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="stat-icon" style="background:#fefce8"><i class="bi bi-person-badge text-warning"></i></div>
          <div><div class="stat-label">Cashiers</div><div class="stat-value" id="stCashier">�</div></div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="stat-icon" style="background:#fff1f2"><i class="bi bi-person-dash text-danger"></i></div>
          <div><div class="stat-label">Inactive</div><div class="stat-value" id="stInactive">�</div></div>
        </div>
      </div>
    </div>

    <!-- List + Detail panel -->
    <div class="card-panel">
      <div class="row g-0" style="min-height:400px">

        <!-- Left: user list -->
        <div class="col-12 col-lg-5 border-end">
          <!-- Filters -->
          <div class="p-3 border-bottom d-flex gap-2 flex-wrap align-items-center">
            <input type="text" class="form-control form-control-sm" id="searchUser" placeholder="Search name or username�" style="max-width:200px">
            <select class="form-select form-select-sm" id="filterRole" style="width:auto">
              <option value="">All Roles</option>
              <option value="superuser">Super User</option>
              <option value="cashier">Cashier</option>
            </select>
            <select class="form-select form-select-sm" id="filterStatus" style="width:auto">
              <option value="">All Status</option>
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>
          <!-- User list -->
          <div id="userList" style="overflow-y:auto; max-height:520px">
            <div class="text-center py-5 text-muted">
              <div class="spinner-border spinner-border-sm text-primary me-2"></div>Loading�
            </div>
          </div>
        </div>

        <!-- Right: detail panel -->
        <div class="col-12 col-lg-7 detail-panel" id="detailPanel">
          <!-- populated by JS -->
        </div>

        <!-- Right: empty state -->
        <div class="col-12 col-lg-7 d-flex align-items-center justify-content-center text-muted" id="detailEmpty">
          <div class="text-center py-5">
            <i class="bi bi-person-circle d-block fs-1 mb-3 opacity-25"></i>
            <p class="mb-0">Select a user to view details</p>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>

<!-- Add / Edit Modal -->
<div class="modal fade" id="userModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="userModalTitle">Add User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="userId">
        <div class="mb-3">
          <label class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="uUsername" placeholder="e.g. john" autocomplete="off">
          <div class="form-text">Lowercase, no spaces. Cannot be changed after creation.</div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Display Name <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="uDisplayName" placeholder="e.g. John Doe">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Role <span class="text-danger">*</span></label>
          <select class="form-select" id="uRole">
            <option value="cashier">Cashier</option>
            <option value="superuser">Super User</option>
          </select>
          <div id="rolePermPreview" class="form-text mt-1" style="font-size:.78rem;line-height:1.6"></div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold" id="passLabel">Password <span class="text-danger">*</span></label>
          <div class="input-group">
            <input type="password" class="form-control" id="uPassword" placeholder="Enter password" autocomplete="new-password">
            <button type="button" class="btn btn-outline-secondary" id="btnTogglePass">
              <i class="bi bi-eye" id="passIcon"></i>
            </button>
          </div>
          <div class="form-text" id="passHint"></div>
        </div>
        <div class="mb-3" id="statusRow" style="display:none">
          <label class="form-label fw-semibold">Status</label>
          <select class="form-select" id="uStatus">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="btnSaveUser">
          <i class="bi bi-check-lg me-1"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Reset Password Modal -->
<div class="modal fade" id="resetModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h6 class="modal-title">Reset Password</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="small text-muted mb-2">Set a new password for <strong id="resetUserName"></strong>.</p>
        <div class="input-group">
          <input type="password" class="form-control" id="newPassword" placeholder="New password" autocomplete="new-password">
          <button type="button" class="btn btn-outline-secondary" id="btnToggleReset">
            <i class="bi bi-eye" id="resetIcon"></i>
          </button>
        </div>
      </div>
      <div class="modal-footer py-2">
        <button type="button" class="btn btn-sm btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-sm btn-primary" id="btnConfirmReset">
          <i class="bi bi-key me-1"></i>Reset
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/main.js"></script>
<script src="/js/users.js"></script>
</body>
</html>
