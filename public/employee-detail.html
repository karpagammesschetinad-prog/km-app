<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Detail – BizTracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon"><i class="bi bi-bar-chart-fill text-white"></i></div>
    BizTracker
  </div>
  <nav>
    <div class="sidebar-section-label">Main</div>
    <a href="/index.html"      class="nav-link su-only"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
    <a href="/expenses.html"   class="nav-link" data-screen="expenses"><i class="bi bi-receipt"></i><span>Expenses</span></a>
    <a href="/categories.html" class="nav-link su-only" data-screen="categories"><i class="bi bi-tags"></i><span>Categories</span></a>
    <a href="/employees.html"  class="nav-link su-only active" data-screen="employees"><i class="bi bi-people"></i><span>Employees</span></a>
      <a href="/sales.html"       class="nav-link" data-screen="sales"><i class="bi bi-graph-up-arrow"></i><span>Sales Capture</span></a>
      <a href="/salaries.html"   class="nav-link su-only" data-screen="salaries"><i class="bi bi-cash-stack"></i><span>Salaries</span></a>
    <a href="/users.html"      class="nav-link su-only" data-screen="users"><i class="bi bi-person-lock"></i><span>Users</span></a>
  </nav>
</aside>

<div class="main-content">
  <nav class="top-navbar">
    <div class="d-flex align-items-center gap-3">
      <button class="mobile-toggle" id="sidebarToggle"><i class="bi bi-list fs-4"></i></button>
      <h1 class="page-title">Employee Detail</h1>
    </div>
    <div class="d-flex gap-2">
      <a href="/employees.html" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Back
      </a>
      <button class="btn btn-sm btn-primary" id="btnEditEmployee">
        <i class="bi bi-pencil me-1"></i>Edit
      </button>
    </div>
  </nav>

  <div class="content-wrapper" id="detailContent">
    <div class="text-center py-5">
      <div class="spinner-border text-primary"></div>
    </div>
  </div>
</div>

<!-- Edit Employee Modal -->
<div class="modal fade" id="editEmpModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Employee</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="editEmpForm" novalidate>
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Full Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="editName" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input type="tel" class="form-control" id="editPhone" placeholder="e.g. 9876543210">
            </div>
            <div class="col-md-6">
              <label class="form-label">Start Date <span class="text-danger">*</span></label>
              <input type="date" class="form-control" id="editStartDate" required>
            </div>
            <div class="col-12">
              <label class="form-label">Address</label>
              <textarea class="form-control" id="editAddress" rows="2" placeholder="Residential address"></textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label">Per Day Salary (₹) <span class="text-danger">*</span></label>
              <input type="number" class="form-control" id="editPerDay" required min="0" step="0.01">
            </div>
            <div class="col-md-6">
              <label class="form-label">Daily Petta (₹)</label>
              <input type="number" class="form-control" id="editPetta" min="0" step="0.01" value="0">
            </div>
            <div class="col-md-6">
              <label class="form-label">Status</label>
              <select class="form-select" id="editStatus">
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
            </div>
            <div class="col-12">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="editDailyPay">
                <label class="form-check-label" for="editDailyPay">
                  <strong>Daily Salary</strong>
                  <span class="text-muted small ms-1">— Employee is paid on a daily basis</span>
                </label>
              </div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="btnSaveEdit">
          <i class="bi bi-check-lg me-1"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Add Leave Modal -->
<div class="modal fade" id="leaveModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add Leave</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="leaveForm" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Start Date & Time <span class="text-danger">*</span></label>
              <input type="datetime-local" class="form-control" id="leaveStart" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">End Date & Time <span class="text-muted">(optional)</span></label>
              <input type="datetime-local" class="form-control" id="leaveEnd">
              <div class="form-text">Leave blank while the employee is still away.</div>
            </div>
            <div class="col-12">
              <label class="form-label">Remarks</label>
              <input type="text" class="form-control" id="leaveRemarks" placeholder="Optional reason">
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="btnSaveLeave">
          <i class="bi bi-check-lg me-1"></i>Save Leave
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Add Payment Modal -->
<div class="modal fade" id="paymentModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Record Salary Payment</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="paymentForm" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Payment Date <span class="text-danger">*</span></label>
              <input type="date" class="form-control" id="payDate" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Amount (₹) <span class="text-danger">*</span></label>
              <input type="number" class="form-control" id="payAmount" required min="1" step="0.01">
            </div>
            <div class="col-12">
              <label class="form-label">Remarks</label>
              <input type="text" class="form-control" id="payRemarks" placeholder="Optional note">
            </div>
            <div class="col-12">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="payAddAsExpense" checked>
                <label class="form-check-label" for="payAddAsExpense">
                  <strong>Add as Expense</strong>
                  <span class="text-muted small ms-1">— Record this payment as an expense entry</span>
                </label>
              </div>
            </div>
            <div class="col-12" id="payExpenseTypeWrap">
              <label class="form-label">Expense Category Type <span class="text-danger">*</span></label>
              <select class="form-select" id="payExpenseType"></select>
              <div class="form-text">Required only when this payment is added as an expense.</div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="btnSavePayment">
          <i class="bi bi-check-lg me-1"></i>Save Payment
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Petta Modal -->
<div class="modal fade" id="pettaModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-calendar2-plus me-2"></i>Add Petta For Date</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="pettaForm" novalidate>
          <div class="mb-3">
            <label class="form-label">Effective Date <span class="text-danger">*</span></label>
            <input type="date" class="form-control" id="pettaDate" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Petta Amount (₹) <span class="text-danger">*</span></label>
            <input type="number" class="form-control" id="pettaAmount" min="0" step="0.01" required>
          </div>
          <div class="mb-1">
            <label class="form-label">Remarks</label>
            <textarea class="form-control" id="pettaRemarks" rows="2" placeholder="Reason / Notes"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="btnSavePetta">
          <i class="bi bi-check-lg me-1"></i>Save Petta
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/main.js"></script>
<script src="/js/employee-detail.js"></script>
</body>
</html>
