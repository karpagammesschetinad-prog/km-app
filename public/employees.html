<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employees – BizTracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon"><i class="bi bi-bar-chart-fill text-white"></i></div>
    BizTracker
  </div>
  <nav>
    <div class="sidebar-section-label">Main</div>
    <a href="/index.html" class="nav-link su-only"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
    <a href="/expenses.html"    class="nav-link" data-screen="expenses"><i class="bi bi-receipt"></i><span>Expenses</span></a>
    <a href="/sales.html"       class="nav-link" data-screen="sales"><i class="bi bi-graph-up-arrow"></i><span>Sales Capture</span></a>
    <a href="/categories.html"  class="nav-link su-only" data-screen="categories"><i class="bi bi-tags"></i><span>Categories</span></a>
    <a href="/employees.html"   class="nav-link su-only" data-screen="employees"><i class="bi bi-people"></i><span>Employees</span></a>
      <a href="/salaries.html" class="nav-link su-only" data-screen="salaries"><i class="bi bi-cash-stack"></i><span>Salaries</span></a>
    <a href="/users.html" class="nav-link su-only" data-screen="users"><i class="bi bi-person-lock"></i><span>Users</span></a>
  </nav>
</aside>

<div class="main-content">
  <nav class="top-navbar">
    <div class="d-flex align-items-center gap-3">
      <button class="mobile-toggle" id="sidebarToggle"><i class="bi bi-list fs-4"></i></button>
      <h1 class="page-title">Employees</h1>
    </div>
    <button class="btn btn-primary btn-sm su-only" data-screen="employees" data-sub="add" id="btnAddEmployee">
      <i class="bi bi-person-plus me-1"></i>Add Employee
    </button>
  </nav>

  <div class="content-wrapper">

    <!-- Search bar -->
    <div class="filter-bar mb-3 d-flex align-items-center gap-3">
      <i class="bi bi-search text-muted"></i>
      <input type="text" class="form-control form-control-sm" id="empSearch"
        placeholder="Search by name or phone…" style="max-width:400px;">
      <span class="ms-auto text-muted small">
        <strong id="empCount">0</strong> employees
      </span>
    </div>

    <!-- Table -->
    <div class="card-panel">
      <div class="card-panel-header">
        <h6 class="card-panel-title">Employee Directory</h6>
      </div>
      <div class="table-responsive">
        <table class="table mobile-grid-table">
          <thead>
            <tr>
              <th>Name</th><th>Phone</th><th>Start Date</th>
              <th class="col-perday">Per Day</th><th>Petta</th><th>Status</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="empBody"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<!-- Add/Edit Employee Modal -->
<div class="modal fade" id="empModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="empModalTitle">Add Employee</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="empForm" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Full Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="empName" required placeholder="e.g. Rajan">
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input type="tel" class="form-control" id="empPhone" placeholder="e.g. 9876543210">
            </div>
            <div class="col-12">
              <label class="form-label">Address</label>
              <textarea class="form-control" id="empAddress" rows="2" placeholder="Residential address"></textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label">Start Date <span class="text-danger">*</span></label>
              <input type="date" class="form-control" id="empStartDate" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Per Day Salary (₹)</label>
              <input type="number" class="form-control" id="empPerDay" min="0" step="0.01" placeholder="Not used for temporary employees">
            </div>
            <div class="col-md-6">
              <label class="form-label">Daily Petta (₹)</label>
              <input type="number" class="form-control" id="empPetta" min="0" step="0.01" value="0" placeholder="0">
            </div>
            <div class="col-md-6">
              <label class="form-label">Status</label>
              <select class="form-select" id="empStatus">
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
            </div>
            <div class="col-12">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="empDailyPay">
                <label class="form-check-label" for="empDailyPay">
                  <strong>Daily Salary</strong>
                  <span class="text-muted small ms-1">— Employee is paid on a daily basis</span>
                </label>
              </div>
            </div>
            <div class="col-12">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="empTemporary">
                <label class="form-check-label" for="empTemporary">
                  <strong>Temporary Employee</strong>
                  <span class="text-muted small ms-1">— Salary payments are automatically recorded as Night expenses</span>
                </label>
              </div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="btnSaveEmployee">
          <i class="bi bi-check-lg me-1"></i>Save Employee
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/main.js"></script>
<script src="/js/employees.js"></script>
</body>
</html>
